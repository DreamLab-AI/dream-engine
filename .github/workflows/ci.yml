name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (with coverage)
        run: npx vitest run --coverage
      - name: CLI smoke test (proves the published bin works)
        run: |
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js init --repo acme/widget --out /tmp/c.json
          node packages/cli/dist/bin.js compile /tmp/c.json --out /tmp/p.md
          test -s /tmp/p.md
          echo "hello" > /tmp/r.md
          W=$(node packages/cli/dist/bin.js witness stamp /tmp/r.md $(git rev-parse HEAD) | awk '/witness /{print $3}')
          node packages/cli/dist/bin.js witness verify /tmp/r.md $(git rev-parse HEAD) "$W"

  no-optional-deps:
    # ADR-150 invariant: the engine builds and tests with the optional
    # ruvector/RVF wasm packages ABSENT (they are peer-optional).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npx vitest run packages/memory
