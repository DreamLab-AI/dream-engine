[package]
name = "dream-gate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic, pure acceptance gate for model-written patches: frozen manifests, typed evaluator receipts, protected-path guard and evidence-gated verdicts."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gate", "patch", "verdict", "self-improvement", "evaluation"]
categories = ["development-tools", "development-tools::testing"]
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pairwise-gate = { path = "../pairwise-gate", version = "0.1.0" }
failure-fingerprint = { path = "../failure-fingerprint", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
