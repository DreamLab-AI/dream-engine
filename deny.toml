# cargo-deny policy for the dream-engine workspace.

[graph]
all-features = true

[licenses]
# cargo-deny v2 has no licence deny list: anything not allowed here is denied,
# which is how GPL, AGPL, LGPL and SSPL are kept out.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # The engine must stay free of the forum stack and of database or client
    # crates that would tie it to one host.
    { name = "nostr-bbs-core" },
    { name = "sqlx" },
    { name = "loom-client" },
]

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
